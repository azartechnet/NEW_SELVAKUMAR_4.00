<html>
    <head>
        <title>CSS Border Example</title>
    </head>
    <body>
        <h1>CSS Border Example</h1>
        <div style="border: 2px solid black; padding: 100px;margin-top: 100px;">
            This is a div with a solid black border.
        </div>
        <div style="border: 2px dashed red; padding: 10px; margin-top: 10px;">
            This is a div with a dashed red border.
        </div>
        <div style="border: 2px dotted blue; padding: 10px; margin-top: 10px;">
            This is a div with a dotted blue border.
        </div>
</html>
