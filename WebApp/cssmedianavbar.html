<style>
  *
  {
    margin: 0;
    padding:0;
    box-sizing: border-box;
  }
  body
  {
    font-family: 'Courier New', Courier, monospace;
    background-color: rgb(243, 245, 245);
  }
  .flex-container
  {
    display: flex;
    /* border-radius: 50%; */
  }
  .flex-container>div
  {
    margin: 10px;
    padding:20px;
    font-size: 30px;
    
  }
  /*nav bar container*/
  nav
  {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding:15px 40px;
    background-color: rgb(253, 253, 167);
  }
  .logo
  {
    font-size: 30px;
    color: rgb(93, 174, 245);
    letter-spacing: 3px;
  }
  .nav-links
  {
    display: flex;
    gap:30px;
    list-style: none;
  }
  .nav-links a
  {
    text-decoration: none;
    transition: color 0.3s ease;
  }
  .nav-links a:hover
  {
    color:rgb(54, 177, 243);
  }
  /*Product*/
  .card-container
  {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap:20px;
      padding:40px 20px;
  }
  .card
  {
    background-color: #f3a2a2;
    border-radius: 12px;
    box-shadow: 0 4px 8px rgb(247, 28, 64);
    overflow: hidden;
    width:250px;
  }
  .card:hover
  {
    transform: translateY(-5px);
  }
  .card img
  {
    width:100%;
    height:180px;
    object-fit: cover;
  }
  .card-content button
  {
    padding:8px 14px;
    border:none;
    background-color: antiquewhite;
    border-radius: 6px;
    cursor: pointer;
  }
  @media (max-width:768px)
  {
    nav
    {
        flex-direction: column;
        align-items: center;
        gap:20px;
    }
    .nav-links
    {
        flex-direction: column;
        gap:15px;
        align-items: center;
    }
    .s1
    {
       height: 50%;
    }
    .flex-container
    {
        flex-direction: column;
    }
    .flex-container>div
    {
        width:100%
    }
  }
</style>
